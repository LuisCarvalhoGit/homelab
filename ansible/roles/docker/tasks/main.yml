---
- name: Criar diretoria para chave GPG do Docker
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Adicionar chave GPG oficial do Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Adicionar repositorio APT oficial do Docker
  apt_repository:
    repo: "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: Instalar Motor Docker e Compose Plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Garantir que o servico Docker esta a correr
  service:
    name: docker
    state: started
    enabled: yes

- name: Adicionar utilizador ao grupo docker
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes