services:
  portainer:
    image: portainer/portainer-ce:2.45.3-linux-arm64
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -H unix:///var/run/docker.sock --admin-password-file /run/secrets/portainer_pass
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`rpi0.tail349f50.ts.net`) && PathPrefix(`/portainer`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=myresolver"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.portainer-strip.stripprefix.prefixes=/portainer"
      - "traefik.http.routers.portainer.middlewares=portainer-strip"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - homelab_net
    secrets:
      - portainer_pass


volumes:
  portainer_data:


networks:
  homelab_net:
    external: true

secrets:
  portainer_pass:
    file: ./.secrets/portainer_pass.txt

